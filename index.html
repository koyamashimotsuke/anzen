<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#18202E; --muted:#566074; --faint:#8790A2;
  --line:#DCE0E8; --line-strong:#C3CAD6;
  --accent:#27468F; --accent-ink:#FFFFFF; --accent-soft:#E5EBF7;
  --ok:#1D7443; --ok-soft:#E1F1E7; --minor:#945E00; --minor-soft:#FAEFD8; --major:#BA3324; --major-soft:#F9E3DF;
  --on-sem:#FFFFFF;
  --shadow:0 1px 2px rgba(18,28,56,.06),0 3px 10px rgba(18,28,56,.05);
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131A; --surface:#191E27; --surface-2:#1F2530; --ink:#E6E9F0; --muted:#A0A8B8; --faint:#7A8396;
    --line:#2B3240; --line-strong:#3B4456;
    --accent:#93ACF2; --accent-ink:#0F1730; --accent-soft:#222C47;
    --ok:#5BC98A; --ok-soft:#16321F; --minor:#EDB54E; --minor-soft:#372B12; --major:#FF7F6E; --major-soft:#3D1D18;
    --on-sem:#10131A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131A; --surface:#191E27; --surface-2:#1F2530; --ink:#E6E9F0; --muted:#A0A8B8; --faint:#7A8396;
  --line:#2B3240; --line-strong:#3B4456;
  --accent:#93ACF2; --accent-ink:#0F1730; --accent-soft:#222C47;
  --ok:#5BC98A; --ok-soft:#16321F; --minor:#EDB54E; --minor-soft:#372B12; --major:#FF7F6E; --major-soft:#3D1D18;
  --on-sem:#10131A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.brand .yr{font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.saved i{background:var(--ok)} .sync.saving i{background:var(--minor)} .sync.error i{background:var(--major)}
.tabs{display:flex;gap:4px;padding-block:4px 0;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px 11px;font-size:15px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;flex:0 0 auto}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* 月の選択：点検途中の月は黄色で目立たせる */
.periods{display:flex;gap:6px;overflow-x:auto;padding-block:8px 10px;scrollbar-width:thin}
.pchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;font-weight:700;color:var(--ink)}
.pchip small{display:block;font-size:11px;line-height:1.35;min-height:1.35em;padding:0 6px;border-radius:999px;font-weight:700;color:var(--faint)}
.pchip.st-part{background:var(--minor-soft);border-color:var(--minor);border-width:2px}
.pchip.st-part small{background:var(--minor);color:var(--on-sem)}
.pchip.st-done small{color:var(--ok)}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.pchip[aria-pressed="true"].st-done small,.pchip[aria-pressed="true"]:not(.st-part) small{color:var(--accent-ink)}
.pchip.now:not([aria-pressed="true"]):not(.st-part){border-color:var(--accent)}

main{padding-block:18px 60px}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.banner.warn{background:var(--minor-soft)}
.banner.part{background:var(--minor-soft);border:2px solid var(--minor);font-weight:700}
.muted{color:var(--muted)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{margin:0;font-size:20px;text-wrap:balance}
h3.sub{margin:28px 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.progress{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:5px}

.seg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-size:14px;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 16px;font-size:15px;font-weight:700;color:var(--ink);text-align:left}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--major)}
.btn.small{padding:5px 10px;font-size:13.5px;min-width:38px}
.btn:disabled{opacity:.45;cursor:default}

/* team picker */
.teampick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tchip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:9px 16px;font-size:16px;font-weight:700;min-height:46px}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.teamhead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.teamhead h2{margin:0;font-size:21px}
.teamhead .mem{font-size:14px;color:var(--muted)}
.teamhead .progress{grid-column:1/-1}
.teamhead .go{min-height:52px;font-size:16px}

/* place list */
.summary-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.summary-line .progress{flex:1 1 180px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto auto;gap:2px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 10px;box-shadow:var(--shadow);width:100%}
.pcard.st-partial{border:2px solid var(--minor)}
.pnum{grid-row:1/3;align-self:center;min-width:2.3em;height:2.3em;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted)}
.pnum.step{background:var(--accent-soft);border-color:transparent;color:var(--accent);border-radius:50%}
.pname{font-weight:700;font-size:16px;line-height:1.35;align-self:end}
.pmeta{grid-column:2;font-size:13px;color:var(--muted);min-height:1.3em}
.pstat{grid-column:3;grid-row:1/3;align-self:center}
.pbar{grid-column:1/-1;margin-top:8px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--minor)}
.pcard.st-done .pbar i{background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.minor{background:var(--minor-soft);color:var(--minor);border-color:transparent}
.pill.major{background:var(--major-soft);color:var(--major);border-color:transparent}
.pill.prog{background:var(--minor);color:var(--on-sem);border-color:transparent}
.pill-set{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* place detail */
.stepper{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.step{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px;font-weight:700;color:var(--ink);max-width:260px}
.step b{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;background:var(--surface-2);color:var(--muted)}
.step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.st-done b{background:var(--ok);color:var(--on-sem)}
.step.st-partial b{background:var(--minor);color:var(--on-sem)}
.step.has-bad b{background:var(--major);color:var(--on-sem)}
.step.on{border-color:var(--accent);background:var(--accent-soft)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{margin:0;font-size:22px;line-height:1.35;text-wrap:balance}
.phead .when{font-size:14px;color:var(--muted)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.05em}
.input{width:100%;border:1.5px solid var(--line-strong);border-radius:9px;background:var(--surface);padding:9px 11px;font-size:16px;min-height:44px}
.input.sm{min-height:38px;padding:6px 9px;font-size:15px}
textarea.input{min-height:84px;resize:vertical;line-height:1.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:10px 2px 12px}
.legend b{font-weight:700}
.legend .s-ok{color:var(--ok)} .legend .s-minor{color:var(--minor)} .legend .s-major{color:var(--major)}
.allok{width:100%;min-height:56px;font-size:17px;border:2px solid var(--ok);color:var(--ok);background:var(--ok-soft);border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.allok:disabled{border-color:var(--line);color:var(--muted);background:var(--surface-2)}
.allok .sym{font-size:22px}
.allok.stick{position:sticky;top:calc(var(--top-h,120px) + var(--step-h,0px) + env(safe-area-inset-top,0px) + 6px);z-index:14;box-shadow:0 4px 12px rgba(18,28,56,.14)}
.gjump{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 0}

.items{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp{padding:8px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.items>.grp:first-child{border-top:0}
.item{display:grid;grid-template-columns:2.1em 1fr auto;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.items>.item:first-child{border-top:0}
.item.s-minor{background:var(--minor-soft)}
.item.s-major{background:var(--major-soft)}
.item.na .itxt{color:var(--faint)}
.ino{font-weight:700;color:var(--muted);text-align:right;font-size:15px;align-self:start;padding-top:1px}
.itxt{white-space:pre-line;line-height:1.5}
.meth{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.meth span{font-size:11.5px;border:1px solid var(--line-strong);color:var(--muted);border-radius:5px;padding:0 6px;line-height:1.6;background:var(--surface)}
.prev{margin-top:5px;font-size:13px;color:var(--muted)}
.prev b.minor{color:var(--minor)} .prev b.major{color:var(--major)}
.marks{display:flex;gap:6px}
.mk{width:56px;height:48px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:23px;font-weight:700;line-height:1;color:var(--faint);display:flex;align-items:center;justify-content:center}
.mk.ok.on{background:var(--ok);border-color:var(--ok);color:var(--on-sem)}
.mk.minor.on{background:var(--minor);border-color:var(--minor);color:var(--on-sem)}
.mk.major.on{background:var(--major);border-color:var(--major);color:var(--on-sem)}
.mk:disabled{cursor:default;opacity:.6}
.na-tag{font-size:13px;font-weight:700;color:var(--muted);border:1.5px dashed var(--line-strong);border-radius:10px;padding:10px 12px;white-space:nowrap;text-align:center}
.detail{grid-column:2/-1;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{margin-right:2px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.3;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.prevc{border-style:dashed}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drow .input{flex:1 1 220px}

.memo{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.memo h3{margin:0 0 4px;font-size:15px}
.foot-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.foot-nav .btn{min-height:52px}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap}
table.grid thead th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:12.5px}
table.grid .lft{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.grid thead .lft{background:var(--surface-2);z-index:2}
table.grid td.txt{white-space:normal;min-width:15em;text-align:left;line-height:1.45}
table.grid tbody tr:last-child td{border-bottom:0}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;border-radius:7px;font-weight:700;border:0;background:none;padding:0 4px;font-size:14px}
.cell.ok{color:var(--ok)} .cell.minor{background:var(--minor-soft);color:var(--minor)} .cell.major{background:var(--major-soft);color:var(--major)}
.cell.partial{background:var(--minor);color:var(--on-sem);font-size:12px} .cell.none,.cell.na{color:var(--line-strong)}
.cell.cur{outline:2px solid var(--accent);outline-offset:-2px}
button.cell:hover{background:var(--accent-soft)}

/* report */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--muted);letter-spacing:.05em}
.stat .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:4px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:400;margin-left:2px}
.stat.major .v{color:var(--major)} .stat.minor .v{color:var(--minor)} .stat.ok .v{color:var(--ok)}
.teamrows{display:flex;flex-direction:column;gap:8px}
.teamrow{display:grid;grid-template-columns:minmax(7em,auto) 1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.teamrow.part{border:2px solid var(--minor)}
.teamrow .tn{font-weight:700}
.teamrow .tn small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.teamrow .left{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.issues{display:flex;flex-direction:column;gap:8px}
.issue{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sev{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--on-sem)}
.sev.minor{background:var(--minor)} .sev.major{background:var(--major)}
.issue .where{font-weight:700}
.issue .where button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-align:left}
.issue .what{font-size:14px;color:var(--muted);margin-top:2px}
.issue .note{margin-top:4px}
.issue .who{font-size:12.5px;color:var(--muted);margin-top:4px}
.issue .seg button{padding:6px 10px;font-size:13px}
.seq{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;margin-right:8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.new{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cmt{margin-top:10px;padding:10px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.cmt .prev{margin:0}
.empty{padding:16px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);text-align:center;background:var(--surface)}

/* A4 報告書（紙の見た目で固定） */
.a4wrap{overflow:hidden;padding-bottom:8px}
.a4{background:#fff;color:#111;width:210mm;min-height:297mm;margin:0 auto;padding:13mm 12mm;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:var(--font);font-size:9.3pt;line-height:1.45}
.a4-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;margin-bottom:4mm}
.a4-title{font-size:15pt;font-weight:700;letter-spacing:.06em}
.a4-sub{font-size:9.5pt;margin-top:1.5mm}
.a4 .stamp{border-collapse:collapse;flex:0 0 auto}
.a4 .stamp th,.a4 .stamp td{border:0.6pt solid #333;width:16mm;text-align:center;font-size:7.8pt;line-height:1.2;font-weight:400;padding:0.8mm;vertical-align:middle}
.a4 .stamp th{height:8mm}
.a4 .stamp td{height:15mm}
.a4 h4{font-size:10.5pt;margin:5mm 0 1.8mm;padding-bottom:0.8mm;border-bottom:1pt solid #333;break-after:avoid}
.a4 .kpi{display:flex;gap:5mm;flex-wrap:wrap;font-size:10pt;margin-bottom:2mm}
.a4 .kpi b{font-size:12pt}
.a4t{width:100%;border-collapse:collapse;font-size:8.8pt}
.a4t th,.a4t td{border:0.5pt solid #555;padding:1.1mm 1.5mm;vertical-align:top;text-align:left}
.a4t th{background:#EDEDED;font-weight:700;white-space:nowrap}
.a4t thead{display:table-header-group}
.a4t tr{break-inside:avoid}
.a4t .c{text-align:center;white-space:nowrap}
.a4t .sym{font-weight:700;font-size:10pt}
.a4 .none{color:#555;font-size:9pt;margin:0}
.a4 .memo-box{border:0.6pt solid #333;height:22mm;margin-top:1mm}
.a4 .stampwrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1.5mm}
.a4 .kian{font-size:9.5pt;letter-spacing:.05em;border-bottom:0.6pt solid #333;padding:0 1mm 0.8mm;white-space:pre}
.a4.land{width:297mm;min-height:210mm;padding:10mm 11mm}
.a4 .sm{font-size:7.8pt;color:#333;line-height:1.35;margin-top:0.6mm}
.a4 .since{font-size:7.5pt;color:#444}
.a4 .hint{font-size:8.5pt;font-weight:400;margin-left:3mm}
.a4t td.write{height:13mm;font-size:9pt}
.a4t tr.isnew td:nth-child(2){background:#F1F1F1}
.a4 .kpi{margin:1.5mm 0 1mm}

/* 使い方 */
.help{max-width:760px}
.help section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.help h3{margin:0 0 8px;font-size:17px}
.help ol,.help ul{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.help p{margin:0 0 8px}
.help .k{display:inline-block;border:1.5px solid var(--line-strong);border-radius:7px;padding:0 7px;font-weight:700;font-size:14px;background:var(--surface-2)}
.help .k.ok{color:var(--ok)} .help .k.minor{color:var(--minor)} .help .k.major{color:var(--major)}
.help .toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.help section{scroll-margin-top:130px}/* 場所・設定・使い方のボタン列は、スクロールしても見出しの下に留める */
.stepper,.subnav,.help .toc{position:sticky;top:calc(var(--top-h,120px) + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);padding-block:8px;margin-inline:-4px;padding-inline:4px;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.stepper{margin-bottom:10px}
.grp,.help section,.item{scroll-margin-top:calc(var(--top-h,120px) + var(--step-h,0px) + 80px)}.rbar{position:sticky;top:calc(var(--top-h,120px) + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);padding-block:8px;margin-inline:-4px;padding-inline:4px;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.prevbox{margin-top:8px;border-radius:9px;padding:8px 10px;border:1.5px solid var(--minor);background:var(--minor-soft)}
.prevbox.major{border-color:var(--major);background:var(--major-soft)}
.prevbox .ph{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--minor)}
.prevbox.major .ph{color:var(--major)}
.prevbox .psym,.prevpanel .psym{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--minor);color:var(--on-sem);font-size:14px;font-weight:700;flex:0 0 22px}
.prevbox.major .psym,.prevpanel .psym.major{background:var(--major)}
.prevbox .pnote{margin-top:3px;font-size:15px;font-weight:700;color:var(--ink);line-height:1.45}
.prevbox .pcmt{margin-top:3px;font-size:13px;color:var(--ink)}
.pdone{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--ok);color:var(--on-sem);margin-left:auto}
.prevpanel{background:var(--surface);border:2px solid var(--minor);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.prevpanel h3{margin:0 0 8px;font-size:15.5px;color:var(--minor)}
.prevpanel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prevpanel li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;color:var(--ink)}
.prevpanel .pno{font-weight:700;color:var(--muted);font-size:13.5px;flex:0 0 auto}
.prevpanel .ptxt{flex:1;display:flex;flex-direction:column;line-height:1.4}
.prevpanel .ptxt small{font-size:12.5px;color:var(--muted);font-weight:400}
.prevpanel p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.pill.prevp{background:var(--minor-soft);color:var(--minor);border-color:var(--minor);margin-left:8px;padding:0 8px;font-size:12px}
.item.flash{outline:3px solid var(--accent);outline-offset:-3px}/* settings */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.subnav button{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:700;color:var(--muted)}
.subnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tm{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.tm-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;font-weight:700;font-size:16px}
.tm-h .cnt{font-weight:400;font-size:13.5px;color:var(--muted);margin-left:auto}
.tm-h .chev{color:var(--muted)}
.tm-b{padding:0 14px 14px;border-top:1px solid var(--line)}
.route{list-style:none;margin:10px 0 8px;padding:0;display:flex;flex-direction:column;gap:5px}
.route li{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.route li b{min-width:1.6em;color:var(--accent)}
.route li span{flex:1}
.route li .btn{border-width:1px}
.team-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.team-tools select{max-width:100%;flex:1 1 260px}
.warnlist{font-size:14px;margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--minor-soft)}
.plrow{display:grid;grid-template-columns:3em 1fr minmax(9em,14em) auto;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.plrow:first-child{border-top:0}
.plrow .pn{font-weight:700;color:var(--muted);padding-top:9px;text-align:right}
.acts{display:flex;gap:4px}
.addrow{display:grid;grid-template-columns:minmax(9em,16em) 1fr auto;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong)}
.ied{display:grid;grid-template-columns:2.2em 1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ied .ino{padding-top:9px}
.ied textarea.input{min-height:48px}
.ied-opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.ied-opts .input.sm{width:auto;flex:1 1 150px}
.mt{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:13px;color:var(--muted)}
.mt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.ied-act{display:flex;flex-direction:column;gap:4px}
.input.dup{border-color:var(--major);background:var(--major-soft)}
.dupnote{display:block;font-size:13px;font-weight:700;color:var(--major);margin-top:3px}
.savebar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.savebar.dirty{border:2px solid var(--minor);background:var(--minor-soft)}
.savebar .msg{font-size:13.5px;font-weight:700;flex-basis:100%;order:-2}
.savebar .btn{flex:0 0 auto;padding-block:7px}
.savebar .err{font-size:13.5px;font-weight:700;color:var(--major);flex-basis:100%;order:-1}
.savebar .err:empty{display:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:6px}

@media (max-width:640px){
  .item{grid-template-columns:1.8em 1fr}
  .marks,.na-tag{grid-column:1/-1}
  .mk{flex:1;height:50px}
  .detail{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row2{grid-template-columns:1fr}
  .brand h1{font-size:17px}
  .sync{font-size:11.5px;white-space:normal;text-align:right}
  .savebar{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:6px}
  .tab{padding-inline:8px;font-size:14.5px}
  .teamhead{grid-template-columns:1fr}
  .teamrow{grid-template-columns:1fr auto}
  .teamrow .prog{grid-column:1/-1;order:3}
  .plrow{grid-template-columns:2.2em 1fr}
  .plrow select,.plrow .acts{grid-column:2}
  .addrow{grid-template-columns:1fr}
  .ied{grid-template-columns:1.8em 1fr}
  .ied-act{grid-column:2;flex-direction:row}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{size:A4 landscape;margin:8mm}
  .top,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000;font-size:10.5pt}
  main{padding:0!important}
  .wrap{max-width:none;padding:0}
  .a4wrap{overflow:visible;padding:0}
  .a4{width:auto;min-height:0;padding:0;box-shadow:none;margin:0;zoom:1!important}
  .tablewrap,.items,.issue,.stat,.memo,.teamrow{border-color:#999;box-shadow:none}
}

const WINTER = [12,1,2,3];
/* 令和8年度に学校で決めた変更 */
const SHEET_CHANGES = {
  cls: {months:{'19':WINTER}},
  stu: {months:{'19':WINTER}},
  gym: {months:{'9':WINTER}},
  hom: {remove:['16']},   /* No.8 と同じ内容（消火器は常備されているか）のため統合 */
  kit: {add:[{id:'19', text:'検収室 棚のゆがみ'}, {id:'20', text:'不審物（カメラ等）'}]}
};
function defaultSheets(){
  return SHEET_DEFS.map(([id, n, name, idx]) => {
    const ch = SHEET_CHANGES[id] || {};
    let items = SHEETS[idx].items.map(it => ({id:String(it.no), text:it.text.trim(), methods:it.methods || [], group:it.group || '',
      months:(ch.months && ch.months[it.no]) || null}));
    if (ch.remove) items = items.filter(it => !ch.remove.includes(it.id));
    if (ch.add) items = items.concat(ch.add.map(x => ({id:x.id, text:x.text, methods:[], group:'', months:null})));
    return {id, n, name, items};
  });
}

/* その月の最終日（途中で追加した項目・場所は、追加した月から数える） */
function periodEnd(period){
  const per = PERIOD_BY_ID[period];
  if (!per || !per.m) return '';
  const y = 2018 + S.year + (per.m < 4 ? 1 : 0);
  return y + '-' + pad(per.m) + '-' + pad(new Date(y, per.m, 0).getDate());
}
const inPeriod = (x, period) => !x.since || !periodEnd(period) || periodEnd(period) >= x.since;
const placesFor = (list, period) => list.filter(p => inPeriod(p, period));
/* 項目がその月に点検対象か（加湿器・暖房器具は 12〜3月のみ など） */
function itemApplies(it, period, r){
  if (!inPeriod(it, period)) return false;
  if (!it.months) return true;
  const per = PERIOD_BY_ID[period];
  const m = per.m || monthOf(r && r.date ? r.date : todayISO());
  return it.months.includes(m);
}
function summarize(place, period, rOverride){
  const r = rOverride || S.records[recKey(place.id, period)];
  let total = 0, ok = 0, minor = 0, major = 0, open = 0;
  for (const it of place.items){
    if (!itemApplies(it, period, r)) continue;
    total++;
    const m = r && r.marks ? r.marks[it.id] : null;
    if (m === 'ok') ok++;
    else if (m === 'minor' || m === 'major'){
      m === 'minor' ? minor++ : major++;
      if (!(r.status && r.status[it.id] === 'done')) open++;
    }
  }
  const marked = ok + minor + major;
  const state = marked === 0 ? 'none' : (marked >= total ? 'done' : 'partial');
  return {r, total, ok, minor, major, open, marked, state};
}
function issueLines(place, period, r){
  const out = [];
  for (const it of place.items){
    const m = r && r.marks && r.marks[it.id];
    if ((m === 'minor' || m === 'major') && itemApplies(it, period, r))
      out.push(`No.${it.no} ${MARK[m].sym} ${(r.notes || {})[it.id] || '（内容未記入）'}${(r.status || {})[it.id] === 'done' ? '［対応済］' : ''}`);
  }
  return out;
}
function prevRecord(placeId, period){
  const idx = PERIODS.findIndex(p => p.id === period);
  for (let i = idx - 1; i >= 0; i--){
    const r = S.records[recKey(placeId, PERIODS[i].id)];
    if (r && r.marks && Object.values(r.marks).some(Boolean)) return {r, period: PERIODS[i]};
  }
  return null;
}
function frequentPhrases(){
  const base = new Set([...S.config.phrases.state, ...S.config.phrases.action]);
  const count = {};
  for (const k in S.records){
    const notes = S.records[k].notes || {};
    for (const n in notes){
      String(notes[n] || '').split(/[、,，。\n]/).map(s => s.trim()).filter(s => s && s.length <= 20 && !base.has(s)).forEach(s => { count[s] = (count[s] || 0) + 1; });
    }
  }
  return Object.entries(count).filter(([, c]) => c >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([s]) => s);
}

/* 紙の記録（初期データ.gs）を展開：記録のある月は、指定のない項目をすべて ✓ にする */
function expandSeed(seed){
  const places = buildPlaces(S.config);
  const year = seed.year || S.year;
  const records = {};
  const stamp = new Date().toISOString();
  for (const sp of seed.places){
    const place = places.find(p => p.id === sp.place);
    if (!place) continue;
    const team = S.config.teams.find(t => t.id === sp.team);
    for (const per in sp.dates){
      const r = {year, placeId:place.id, period:per, placeName:place.name, periodLabel:PERIOD_BY_ID[per].label,
        date:sp.dates[per], team:sp.team, teamName:team ? team.name : '', marks:{}, notes:{}, status:{}, memo:'',
        source:'紙の記録から取り込み', updatedAt:stamp, seededAt:stamp};
      for (const it of place.items) if (itemApplies(it, per, r)) r.marks[it.id] = 'ok';
      for (const [id, pers, mark, note, donePers] of (sp.issues || [])){
        if (!pers.includes(per) || !place.items.some(it => it.id === id)) continue;
        r.marks[id] = mark;
        const n = typeof note === 'string' ? note : (note && note[per]) || '';
        if (n) r.notes[id] = n;
        if (donePers && donePers.includes(per)) r.status[id] = 'done';
      }
      for (const id in (sp.blank || {})) if (sp.blank[id].includes(per)) delete r.marks[id];
      if (sp.memo && sp.memo[per]) r.memo = sp.memo[per];
      const s = summarize(place, per, r);
      r.counts = {ok:s.ok, minor:s.minor, major:s.major, open:s.open};
      r.summaryLines = issueLines(place, per, r).join('\n');
      records['r' + year + '_' + place.id + '_' + per] = r;
    }
  }
  for (const per in (seed.reports || {})){
    const pinfo = PERIOD_BY_ID[per]; if (!pinfo) continue;
    records['r' + year + '__report_' + per] = {year, placeId:'_report', period:per, placeName:'【所見・指示】', periodLabel:pinfo.label,
      kind:'report', memo:seed.reports[per], source:'紙の詳細報告から取り込み', updatedAt:stamp, seededAt:stamp};
  }  return {config:Object.assign(clone(S.config), {seedImported:seed.version || 'v1'}), records};
}

/* ---- storage adapters ---- */
function makeLocalStore(){
  const KEY = 'anzen-tenken-local-v2';
  let cb, mem = null;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  const save = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} };
  const get = () => mem || (mem = load());
  function emit(){
    const d = get(); const recs = {};
    for (const k in (d.records || {})) if (d.records[k].year === S.year) recs[k] = d.records[k];
    S.seedVersion = window.ANZEN_SEED ? window.ANZEN_SEED.version : '';
    cb.config(d.config || null); cb.records(recs);
  }
  return {
    mode: 'local',
    start(c){ cb = c; emit(); window.addEventListener('storage', e => { if (e.key === KEY){ mem = null; emit(); } }); },
    resubscribe(){ emit(); },
    async patchRecord(key, patch){ const d = get(); d.records = d.records || {}; d.records[key] = deepMerge(d.records[key] || {}, patch); save(d); cb.one(key, d.records[key]); },
    async saveConfig(cfg){ const d = get(); d.config = cfg; save(d); cb.config(cfg); },
    async getSeed(){ return window.ANZEN_SEED || null; },
    async setTeamOrder(tid, places){ const d = get(); const cfg = d.config && d.config.teams ? d.config : clone(S.config); const tm = cfg.teams.find(x => x.id === tid); if (!tm) throw new Error('班が見つかりません'); tm.places = places; d.config = cfg; save(d); cb.config(cfg); },
    async importRecords(data){
      const d = get(); d.records = d.records || {}; let added = 0, skipped = 0;
      for (const k in data.records){
        const ex = d.records[k];
        if (ex && !(ex.source && (!ex.seededAt || ex.updatedAt === ex.seededAt))){ skipped++; continue; }
        d.records[k] = data.records[k]; added++;
      }
      d.config = data.config; save(d); emit();
      return {added, skipped};
    }
  };
}
/* 記録の保存先（スプレッドシートの Apps Script の URL）。画面を別の場所に置くときに使う */
const API_URL = 'https://script.google.com/macros/s/AKfycbywYlCa9Znxgwy05U7hZPYG_cxXv6YW0DHKpiYxH6jZsWSboyZ7SRgAiuiTGGO93AfZ/exec';
const hasGoogleRun = () => !!(window.google && google.script && google.script.run);
function gasCall(fn){
  const args = [].slice.call(arguments, 1);
  if (!hasGoogleRun()) return apiCall(fn, args);
  return new Promise((res, rej) => { const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej); r[fn].apply(r, args); });
}
/* Google のログイン情報（Cookie）を送らずに読み書きする → ブラウザのアカウントの状態に左右されない */
async function apiCall(fn, args){
  const r = await fetch(API_URL, {method:'POST', body:JSON.stringify({fn, args}), headers:{'Content-Type':'text/plain;charset=utf-8'}, credentials:'omit', redirect:'follow'});
  if (!r.ok) throw new Error('通信エラー ' + r.status);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function makeGasStore(){
  let cb, lastWrite = 0, rev = '';
  async function pull(force){
    const started = Date.now();
    try {
      const d = JSON.parse(await gasCall('getAll', S.year, force ? '' : rev));
      if (d.unchanged){ cb.ok(); return; }
      if (started < lastWrite) return;
      rev = d.rev; S.seedVersion = d.seedVersion || '';
      S.fromCache = false;
      cb.config(d.config); cb.records(d.records || {});
      saveCache(d);
    } catch(e){ cb.error(); }
  }
  /* 前回読み込んだ内容を端末に覚えておき、次に開いたときすぐ表示する */
  const CK = 'anzen-cache-' + API_URL.slice(-12);
  function saveCache(d){ try { localStorage.setItem(CK, JSON.stringify({year:S.year, config:d.config, records:d.records, seedVersion:d.seedVersion || '', at:Date.now()})); } catch(e){} }
  function loadCache(){ try { const c = JSON.parse(localStorage.getItem(CK)); return c && c.year === S.year ? c : null; } catch(e){ return null; } }
  return {
    mode: 'gas',
    async start(c){
      cb = c;
      const cached = loadCache();
      if (cached){ S.fromCache = true; S.seedVersion = cached.seedVersion; cb.config(cached.config); cb.records(cached.records || {}); setSync('loading'); }
      await pull(true);
      setInterval(() => { if (!document.hidden) pull(); }, 15000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
    },
    resubscribe(){ return pull(true); },
    async patchRecord(key, patch){
      const r = JSON.parse(await gasCall('patchRecord', key, JSON.stringify(patch)));
      lastWrite = Date.now(); cb.one(key, r);
    },
    async saveConfig(cfg){ await gasCall('saveConfig', JSON.stringify(cfg)); lastWrite = Date.now(); cb.config(cfg); },
    async getSeed(){ return JSON.parse(await gasCall('getSeed')); },
    async setTeamOrder(tid, places){ const cfg = JSON.parse(await gasCall('setTeamOrder', tid, JSON.stringify(places), JSON.stringify(S.config))); lastWrite = Date.now(); cb.config(cfg); },
    async importRecords(data){ const r = JSON.parse(await gasCall('importRecords', JSON.stringify(data))); lastWrite = 0; await pull(true); return r; }
  };
}

/* ---- write queue（まとめて保存・失敗したら再送） ---- */
let store = null;
const Q = {};
function recompute(){
  const r = {};
  for (const k in S.server) r[k] = S.server[k];
  for (const k in Q){
    const q = Q[k];
    if (q.inflight) r[k] = deepMerge(r[k] || {}, q.inflight);
    if (Object.keys(q.patch).length) r[k] = deepMerge(r[k] || {}, q.patch);
  }
  S.records = r;
}
function pendingCount(){ let n = 0; for (const k in Q) if (Q[k].busy || Object.keys(Q[k].patch).length) n++; return n; }
/* 回議の所見・指示（紙に手書きされたものを係が入力する。月ごとに1件） */
const reportKey = (period) => 'r' + S.year + '__report_' + period;
function getShoken(period){ const r = S.records[reportKey(period)]; return r ? (r.memo || '') : ''; }
function patchShoken(period, text){
  if (!S.loaded || !store) return;
  const key = reportKey(period), per = PERIOD_BY_ID[period];
  const p = {year:S.year, placeId:'_report', period, placeName:'【所見・指示】', periodLabel:per.label, kind:'report', memo:text, updatedAt:new Date().toISOString()};
  const q = Q[key] || (Q[key] = {patch:{}, timer:null, busy:false, inflight:null});
  q.patch = deepMerge(q.patch, p);
  clearTimeout(q.timer);
  q.timer = setTimeout(() => flush(key), 600);
  recompute(); setSync('saving');
}function patchRecord(placeId, period, p){
  if (!S.loaded || !store) return;
  const key = recKey(placeId, period);
  const place = placeById(placeId), per = PERIOD_BY_ID[period];
  let base = {};
  if (!S.records[key]){
    const tid = defaultTeamFor(placeId), t = teamById(tid);
    base = {year:S.year, placeId, period, placeName:place ? place.name : placeId, periodLabel:per ? per.label : period,
            date:todayISO(), team:tid, teamName:t ? t.name : ''};
  }
  p = deepMerge(base, p);
  p.updatedAt = new Date().toISOString();
  if (place){
    const merged = deepMerge(S.records[key] || {}, p);
    const s = summarize(place, period, merged);
    p.counts = {ok:s.ok, minor:s.minor, major:s.major, open:s.open};
    p.summaryLines = issueLines(place, period, merged).join('\n');
    p.placeName = place.name;
  }
  const q = Q[key] || (Q[key] = {patch:{}, timer:null, busy:false, inflight:null});
  q.patch = deepMerge(q.patch, p);
  clearTimeout(q.timer);
  q.timer = setTimeout(() => flush(key), 450);
  recompute();
  setSync('saving');
}
async function flush(key){
  const q = Q[key];
  if (!q || q.busy || !Object.keys(q.patch).length) return;
  const p = q.patch; q.patch = {}; q.busy = true; q.inflight = p;
  try {
    await store.patchRecord(key, p);
    q.busy = false; q.inflight = null;
    if (Object.keys(q.patch).length) flush(key);
    else { delete Q[key]; recompute(); if (!pendingCount()) setSync('saved'); }
  } catch(e){
    q.busy = false; q.inflight = null;
    q.patch = deepMerge(p, q.patch);
    setSync('error');
    q.timer = setTimeout(() => flush(key), 5000);
  }
}

      if (!itemApplies(it, PERIODS[i].id, r)) return `<td><span class="cell na${cur}">－</span></td>`;
      const m = r && r.marks && r.marks[it.id];
      return `<td><span class="cell ${m || 'none'}${cur}">${m ? MARK[m].sym : '・'}</span></td>`;
    }).join('')}</tr>`).join('');
  const foot = `<tr><td class="lft"></td><td class="txt muted">点検日</td>${recs.map(r => `<td class="num muted">${h(r ? fmtDate(r.date) : '')}</td>`).join('')}</tr>
    <tr><td class="lft"></td><td class="txt muted">点検班</td>${recs.map(r => `<td class="muted" style="white-space:normal;font-size:12px">${h(teamLabel(r))}</td>`).join('')}</tr>`;
  return `<h3 class="sub">年間の記録　${h(place.name)}</h3>
    <div class="tablewrap"><table class="grid"><thead><tr><th class="lft">No.</th><th class="txt">点検項目</th>${head}</tr></thead><tbody>${body}${foot}</tbody></table></div>`;
}

/* ---- 報告・確認 ---- */
function collectIssues(period){
  const list = [];
  for (const p of S.places){
    const r = S.records[recKey(p.id, period)];
    if (!r || !r.marks) continue;
    for (const it of p.items){
      if (!itemApplies(it, period, r)) continue;
      const m = r.marks[it.id];
      if (m === 'minor' || m === 'major') list.push({place:p, period, it, mark:m, note:(r.notes || {})[it.id] || '', done:(r.status || {})[it.id] === 'done', r});
    }
  }
  return list;
}
/* 以前の点検で未対応：その項目の一番新しい記録が △・× で未対応のものだけ（毎月の重複を出さない） */
function latestPeriodOf(placeId, itemId){
  for (let i = PERIODS.length - 1; i >= 0; i--){
    const r = S.records[recKey(placeId, PERIODS[i].id)];
    if (r && r.marks && r.marks[itemId]) return PERIODS[i].id;
  }
  return null;
}
function openElsewhere(period){
  const out = [];
  for (const per of PERIODS){
    if (per.id === period) continue;
    for (const x of collectIssues(per.id)){
      if (x.done) continue;
      const cur = S.records[recKey(x.place.id, period)];
      if (cur && cur.marks && cur.marks[x.it.id]) continue;
      if (latestPeriodOf(x.place.id, x.it.id) === per.id) out.push(x);
    }
  }
  return out;
}
function whoLine(r){ return [teamLabel(r), fmtDate(r.date)].filter(Boolean).join('　'); }
function issueCard(x){
  const dis = !S.loaded ? ' disabled' : '';
  return `<div class="issue">
    <div><div class="seq num">${x.seq}</div><div class="sev ${x.mark}" aria-label="${MARK[x.mark].label}">${MARK[x.mark].sym}</div></div>
    <div>
      <div class="where"><span class="tag ${x.isNew ? 'new' : ''}">${x.isNew ? '新規' : '継続'}</span><button data-act="goto" data-place="${h(x.place.id)}" data-period="${x.period}">${h(x.place.name)}</button>${!x.cur ? `　<span class="muted" style="font-weight:400">${h(PERIOD_BY_ID[x.period].label)}の点検</span>` : ''}${x.since && !x.isNew ? `　<span class="muted" style="font-weight:400;font-size:13px">${h(x.since.label)}から</span>` : ''}</div>
      <div class="what">No.${h(x.it.no)}　${h(x.it.text)}</div>
      <div class="note">${x.note ? h(x.note) : '<span class="muted">（内容未記入）</span>'}</div>
      <div class="who">${h(whoLine(x.r))}</div>
      ${cmtEditor(x.place.id, x.period, x.it.id, cmtOf(x.r, x.it.id), x.cur ? x.prevCmt : null)}
    </div>
    <div class="seg" role="group" aria-label="対応状況">
      <button data-act="rstatus" data-place="${h(x.place.id)}" data-period="${x.period}" data-item="${h(x.it.id)}" data-val="open" aria-pressed="${!x.done}"${dis}>未対応</button>
      <button data-act="rstatus" data-place="${h(x.place.id)}" data-period="${x.period}" data-item="${h(x.it.id)}" data-val="done" aria-pressed="${x.done}"${dis}>対応済</button>
    </div></div>`;
}/* ---- 所見・指示（不具合1件ごと。回議の後に係が書き写す） ---- */
const WHO = ['事務長','教頭','校長'];
const CMT_PHRASES = ['様子を見る','修理を依頼する','業者に連絡する','予算要求する','使用禁止を続ける','対応済みを確認'];
const cmtOf = (r, id) => (r && r.comments && r.comments[id] && r.comments[id].text) ? r.comments[id] : null;
function lastComment(placeId, itemId, period, inclusive){
  const idx = PERIODS.findIndex(p => p.id === period);
  for (let i = inclusive ? idx : idx - 1; i >= 0; i--){
    const c = cmtOf(S.records[recKey(placeId, PERIODS[i].id)], itemId);
    if (c) return {c, per:PERIODS[i]};
  }
  return null;
}
function firstSeen(placeId, itemId, period){
  const idx = PERIODS.findIndex(p => p.id === period);
  let first = null;
  for (let i = idx; i >= 0; i--){
    const r = S.records[recKey(placeId, PERIODS[i].id)];
    const m = r && r.marks && r.marks[itemId];
    if (m === 'minor' || m === 'major') first = PERIODS[i];
    else if (m === 'ok') break;
  }
  return first;
}
const cmtText = (c) => c ? (c.by ? c.by + '：' : '') + c.text : '';
/* 今月の不具合＋以前から未対応のものを、新規→継続、×→△ の順に並べ、通し番号を付ける */
function reportIssues(period){
  const list = collectIssues(period).map(x => Object.assign(x, {cur:true}))
    .concat(openElsewhere(period).map(x => Object.assign(x, {cur:false})));
  list.forEach(x => {
    const f = firstSeen(x.place.id, x.it.id, x.period);
    x.isNew = x.cur && (!f || f.id === period);
    x.since = f;
    x.prevCmt = lastComment(x.place.id, x.it.id, x.period, !x.cur);
  });
  const rank = (x) => (x.isNew ? 0 : 2) + (x.mark === 'major' ? 0 : 1);
  list.sort((a, b) => rank(a) - rank(b));
  list.forEach((x, i) => { x.seq = i + 1; });
  return list;
}
function cmtEditor(placeId, period, itemId, cur, prev){
  const dis = !S.loaded ? ' disabled' : '';
  const by = cur && cur.by || '';
  const a = `data-place="${h(placeId)}" data-period="${period}" data-item="${h(itemId)}"`;
  return `<div class="cmt">
    ${prev ? `<div class="prev">これまでの所見・指示（${h(prev.per.label)}）：${h(cmtText(prev.c))}</div>` : ''}
    <div class="chips"><span class="lbl">誰の指示</span>${WHO.map(w => `<button class="chip${by === w ? ' on' : ''}" data-act="cby" ${a} data-v="${w}"${dis}>${w}</button>`).join('')}</div>
    <div class="chips"><span class="lbl">よく使う</span>${CMT_PHRASES.map(w => `<button class="chip" data-act="cphrase" ${a} data-v="${h(w)}"${dis}>${h(w)}</button>`).join('')}${prev ? `<button class="chip prevc" data-act="csame" ${a}${dis}>前回と同じ</button>` : ''}</div>
    <input class="input" type="text" enterkeyhint="done" placeholder="所見・指示（紙に書かれた内容を入力）" aria-label="所見・指示" data-field="cmt" ${a} value="${h(cur ? cur.text : '')}"${dis}>
  </div>`;
}
function patchCmt(placeId, period, itemId, part){
  const r = S.records[recKey(placeId, period)] || {};
  const cur = (r.comments && r.comments[itemId]) || {};
  patchRecord(placeId, period, {comments:{[itemId]: Object.assign({}, cur, part)}});
}
function teamProgress(period){
  return S.config.teams.map(t => {
    const ps = placesFor(teamPlaces(t), period).map(p => ({p, s:summarize(p, period)}));
    return {t, ps, done:ps.filter(x => x.s.state === 'done').length,
      major:ps.reduce((a, x) => a + x.s.major, 0), minor:ps.reduce((a, x) => a + x.s.minor, 0),
      left:ps.filter(x => x.s.state !== 'done')};
  });
}
function unassignedPlaces(){ const set = new Set(S.config.teams.flatMap(t => t.places)); return S.places.filter(p => !set.has(p.id)); }
function reportData(period){
  const sums = placesFor(S.places, period).map(p => ({p, s:summarize(p, period)}));
  const issues = collectIssues(period);
  const dates = sums.map(x => x.s.r && x.s.r.date).filter(Boolean).sort();
  return {
    per: PERIOD_BY_ID[period], sums, done: sums.filter(x => x.s.state === 'done').length,
    maj: issues.filter(x => x.mark === 'major'), min: issues.filter(x => x.mark === 'minor'),
    open: issues.filter(x => !x.done).length, others: openElsewhere(period),
    memos: sums.filter(x => x.s.r && x.s.r.memo && x.s.r.memo.trim()),
    notDone: sums.filter(x => x.s.state !== 'done'), tp: teamProgress(period),
    from: dates[0], to: dates[dates.length - 1],
    list: reportIssues(period)
  };
}

/* ---- 設定 ---- */
function settingsDirty(){ return !!S.draftCfg && JSON.stringify(S.draftCfg) !== JSON.stringify(S.config); }
function findProblems(c){
  const bad = new Set(), msgs = [];
  const check = (list, keyOf, nameOf, label) => {
    const seen = {};
    for (const x of list){ const n = normName(nameOf(x)); if (n) (seen[n] = seen[n] || []).push(x); }
    for (const n in seen) if (seen[n].length > 1){ seen[n].forEach(x => bad.add(keyOf(x))); msgs.push(label + '「' + nameOf(seen[n][0]) + '」が重複'); }
  };
  check(c.places, p => 'place:' + p.id, p => p.name, '点検箇所');
  check(c.teams, t => 'team:' + t.id, t => t.name, '班');
  check(c.sheets, s => 'sheet:' + s.id, s => s.name, '点検表');
  c.places.forEach(p => { if (!p.name.trim()){ bad.add('place:' + p.id); msgs.push('名前のない点検箇所があります'); } });
  c.sheets.forEach(s => { if (!s.name.trim()){ bad.add('sheet:' + s.id); msgs.push('名前のない点検表があります'); } });
  return {bad, msgs:[...new Set(msgs)]};
}
function dupAttr(key, bad){ return bad.has(key) ? ' dup' : ''; }
function viewSettings(){
  const c = S.draftCfg || (S.draftCfg = clone(S.config));
  const dis = !S.loaded ? ' disabled' : '';
  const pr = findProblems(c);
  const tabs = [['teams','班と担当箇所'],['places','点検箇所'],['items','点検項目'],['phrases','定型文'],['other','年度・その他']];
  let body = '';
  if (S.setTab === 'teams') body = setTeams(c, dis, pr);
  else if (S.setTab === 'places') body = setPlaces(c, dis, pr);
  else if (S.setTab === 'items') body = setItems(c, dis, pr);
  else if (S.setTab === 'phrases') body = `<div class="card"><h3>不良の内容の定型文</h3><p>△・× を付けたときに出るボタンです。1行に1つずつ書きます。</p>
    <div class="row2">
      <div class="field"><label for="s-ph-state">状態</label><textarea class="input" id="s-ph-state" rows="10" data-e="phrases" data-k="state"${dis}>${h(c.phrases.state.join('\n'))}</textarea></div>
      <div class="field"><label for="s-ph-action">対応</label><textarea class="input" id="s-ph-action" rows="10" data-e="phrases" data-k="action"${dis}>${h(c.phrases.action.join('\n'))}</textarea></div>
    </div></div>`;
  else body = setOther(c, dis);
  return `${topBanner()}
  <div class="sec-h"><h2>設定</h2></div>
  <nav class="subnav" aria-label="設定の項目">${tabs.map(([k, l]) => `<button data-act="settab" data-k="${k}" aria-pressed="${S.setTab === k}">${l}</button>`).join('')}</nav>
  ${body}
  <div class="savebar" id="savebar">
    <button class="btn primary" data-act="save-settings"${dis}>設定を保存</button>
    <button class="btn" data-act="reset-settings">変更を取り消す</button>
    <span class="msg" id="save-msg"></span>
    <span class="err" id="save-err" role="alert"></span>
  </div>`;
}
function updateSaveBar(){
  const bar = $('#savebar'); if (!bar || !S.draftCfg) return;
  const dirty = settingsDirty(), pr = findProblems(S.draftCfg);
  bar.classList.toggle('dirty', dirty);
  $('#save-msg').textContent = dirty ? '保存していない変更があります' : '保存すると、すべての端末に反映されます';
  $('#save-err').textContent = pr.msgs.length ? '保存できません：' + pr.msgs.join('、') : '';
  document.querySelectorAll('[data-dupkey]').forEach(el => {
    const on = pr.bad.has(el.dataset.dupkey);
    el.classList.toggle('dup', on);
    const n = el.parentNode.querySelector('.dupnote'); if (n) n.hidden = !on;
  });
}

/* 設定の入力は下書きにすぐ反映（再描画しない） */
function draftInput(el){
  const c = S.draftCfg; if (!c) return;
  const e = el.dataset.e, f = el.dataset.f, id = el.dataset.id;
  if (e === 'team'){ const t = c.teams.find(x => x.id === id); if (t) t[f] = el.value.trim(); }
  else if (e === 'place'){ const p = c.places.find(x => x.id === id); if (p) p[f] = f === 'name' ? el.value.trim() : el.value; }
  else if (e === 'sheet'){ const s = c.sheets.find(x => x.id === S.editSheet); if (s) s[f] = el.value.trim(); }
  else if (e === 'item'){
    const s = c.sheets.find(x => x.id === S.editSheet); const it = s && s.items.find(x => x.id === id);
    if (it){ if (f === 'months') it.months = el.value ? el.value.split(',').map(Number) : null; else it[f] = f === 'text' ? el.value : el.value.trim(); }
  }
  else if (e === 'phrases') c.phrases[el.dataset.k] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  else if (e === 'moveTo') c.moveTo = el.value.trim();
  else if (e === 'year'){ const y = parseInt(el.value, 10); if (y > 0 && y < 100) c.year = y; }
  updateSaveBar();
}
function moveIn(arr, i, d){ const j = i + d; if (i < 0 || j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
function confirmTwice(key){ if (S.confirm !== key){ S.confirm = key; render(true); return false; } S.confirm = null; return true; }

/* ---- events ---- */
function markItem(itemId, mark){
  const cur = ((S.records[recKey(S.placeId, S.period)] || {}).marks || {})[itemId];
  patchRecord(S.placeId, S.period, {marks:{[itemId]: cur === mark ? null : mark}});
  render(true);
}
function toggleChip(target, text){
  const r = S.records[recKey(S.placeId, S.period)] || {};
  const id = target.slice(2);
  const parts = String((r.notes || {})[id] || '').split('、').map(s => s.trim()).filter(Boolean);
  const i = parts.indexOf(text);
  if (i >= 0) parts.splice(i, 1); else parts.push(text);
  patchRecord(S.placeId, S.period, {notes:{[id]: parts.join('、')}});
  render(true);
}
function openPlace(id){ S.placeId = id; S.annual = false; render(true); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (!/^(team-del|pl-del|it-del|sh-del)$/.test(a)) S.confirm = null;
  const c = S.draftCfg;
  const sheet = () => c.sheets.find(x => x.id === S.editSheet);
  if (a === 'tab'){ S.tab = b.dataset.tab; if (S.tab !== 'check') S.placeId = null; render(true); window.scrollTo(0, 0); }
  else if (a === 'period'){ S.period = b.dataset.period; render(true); }
  else if (a === 'filter'){ S.filter = b.dataset.filter; render(true); }
  else if (a === 'team'){ S.reorder = null; S.team = b.dataset.team; ls.set('anzen-team', S.team); render(true); }
  else if (a === 'open') openPlace(b.dataset.place);
  else if (a === 'goto'){ S.tab = 'check'; S.period = b.dataset.period; openPlace(b.dataset.place); }
  else if (a === 'back'){ const from = S.placeId; S.placeId = null; S.annual = false; render(true); const el = document.querySelector(`.pcard[data-place="${CSS.escape(from || '')}"]`); if (el) el.scrollIntoView({block:'center'}); }
  else if (a === 'mark') markItem(b.dataset.item, b.dataset.mark);
  else if (a === 'gotoitem'){ const el = document.getElementById('item-' + b.dataset.item); if (el){ el.scrollIntoView({block:'start', behavior:'smooth'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); } }
  else if (a === 'gjump'){ const g = document.getElementById('grp-' + b.dataset.g); if (g) g.scrollIntoView({block:'start', behavior:'smooth'}); }
  else if (a === 'allok'){
    const place = placeById(S.placeId); const r = S.records[recKey(S.placeId, S.period)] || {}; const marks = r.marks || {};
    const filled = place.items.filter(it => itemApplies(it, S.period, r) && !marks[it.id]).map(it => it.id);
    if (!filled.length) return;
    const pid = S.placeId, per = S.period;
    patchRecord(pid, per, {marks:Object.fromEntries(filled.map(n => [n, 'ok']))});
    render(true);
    showToast(filled.length + '項目を「異常なし」にしました', '元に戻す', () => { patchRecord(pid, per, {marks:Object.fromEntries(filled.map(n => [n, null]))}); render(true); });
  }
  else if (a === 'chip') toggleChip(b.dataset.target, b.dataset.text);
  else if (a === 'copyprev'){
    const prev = prevRecord(S.placeId, S.period); if (!prev) return;
    patchRecord(S.placeId, S.period, {notes:{[b.dataset.item]: (prev.r.notes || {})[b.dataset.item] || ''}}); render(true);
  }
  else if (a === 'copymemo'){
    const prev = prevRecord(S.placeId, S.period); if (!prev) return;
    const cur = ((S.records[recKey(S.placeId, S.period)] || {}).memo || '').trim();
    patchRecord(S.placeId, S.period, {memo: cur ? cur + '\n' + prev.r.memo : prev.r.memo}); render(true);
  }
  else if (a === 'status'){ patchRecord(S.placeId, S.period, {status:{[b.dataset.item]: b.dataset.val}}); render(true); }
  else if (a === 'cby'){ const r = S.records[recKey(b.dataset.place, b.dataset.period)] || {}; const cur = (r.comments || {})[b.dataset.item] || {}; patchCmt(b.dataset.place, b.dataset.period, b.dataset.item, {by: cur.by === b.dataset.v ? '' : b.dataset.v}); render(true); }
  else if (a === 'cphrase'){ const r = S.records[recKey(b.dataset.place, b.dataset.period)] || {}; const cur = ((r.comments || {})[b.dataset.item] || {}).text || ''; patchCmt(b.dataset.place, b.dataset.period, b.dataset.item, {text: cur ? cur + '。' + b.dataset.v : b.dataset.v}); render(true); }
  else if (a === 'csame'){ const pc = lastComment(b.dataset.place, b.dataset.item, b.dataset.period, false); if (pc) patchCmt(b.dataset.place, b.dataset.period, b.dataset.item, {text: pc.c.text, by: pc.c.by || ''}); render(true); }
  else if (a === 'rstatus'){ patchRecord(b.dataset.place, b.dataset.period, {status:{[b.dataset.item]: b.dataset.val}}); render(true); }
  else if (a === 'annual'){ S.annual = !S.annual; render(true); }
  else if (a === 'reorder'){ const tm = currentTeam(); if (!tm) return; S.reorder = tm.places.filter(pid => placeById(pid)); render(true); window.scrollTo(0, 0); }
  else if (a === 'ro-move'){ moveIn(S.reorder, +b.dataset.i, +b.dataset.d); render(true); }
  else if (a === 'ro-cancel'){ S.reorder = null; render(true); }
  else if (a === 'ro-save'){
    const tm = currentTeam(); if (!tm) return;
    const rest = tm.places.filter(pid => !S.reorder.includes(pid));
    S.reorderBusy = true; render(true);
    store.setTeamOrder(tm.id, S.reorder.concat(rest)).then(() => { S.reorder = null; showToast('回る順を保存しました'); },
      () => showToast('保存できませんでした。通信状態を確認して、もう一度お試しください。'))
      .then(() => { S.reorderBusy = false; render(true); });
  }  else if (a === 'hjump'){ const el = document.getElementById('help-' + b.dataset.id); if (el) el.scrollIntoView({block:'start', behavior:'smooth'}); }
  else if (a === 'rview'){ S.reportView = b.dataset.v; render(true); }
  else if (a === 'print'){ try { window.print(); } catch(err){ showToast('印刷を開けませんでした。ブラウザのメニューから印刷してください。'); } }
  /* 設定 */
  else if (a === 'settab'){ S.setTab = b.dataset.k; ls.set('anzen-settab', S.setTab); render(true); }
  else if (a === 'team-open'){ S.openTeam = S.openTeam === b.dataset.team ? null : b.dataset.team; render(true); }
  else if (a === 'team-add'){
    const used = new Set(c.teams.map(t => normName(t.name)));
    let n = c.teams.length + 1; while (used.has(normName(n + '班'))) n++;
    const t = {id:uid('t'), name:n + '班', members:'', places:[]};
    c.teams.push(t); S.openTeam = t.id; render(true);
  }
  else if (a === 'team-del'){ if (!confirmTwice('team:' + b.dataset.team)) return; c.teams = c.teams.filter(t => t.id !== b.dataset.team); render(true); }
  else if (a === 'tp-move' || a === 'tp-del'){
    const t = c.teams.find(x => x.id === b.dataset.team); if (!t) return;
    const i = t.places.indexOf(b.dataset.pid);
    if (a === 'tp-del') t.places.splice(i, 1); else moveIn(t.places, i, +b.dataset.d);
    render(true);
  }
  else if (a === 'pl-move'){ moveIn(c.places, c.places.findIndex(p => p.id === b.dataset.id), +b.dataset.d); render(true); }
  else if (a === 'pl-del'){
    if (!confirmTwice('place:' + b.dataset.id)) return;
    c.places = c.places.filter(p => p.id !== b.dataset.id);
    c.teams.forEach(t => { t.places = t.places.filter(pid => pid !== b.dataset.id); });
    render(true);
  }
  else if (a === 'pl-add'){
    const name = $('#new-place-name').value.trim(), sh = $('#new-place-sheet').value;
    if (!name){ showToast('新しい点検箇所の名前を入れてください。'); $('#new-place-name').focus(); return; }
    if (c.places.some(p => normName(p.name) === normName(name))){ showToast('同じ名前の点検箇所がすでにあります。'); return; }
    c.places.push({id:uid(sh + '-'), sheet:sh, name, since:todayISO()}); render(true);
    showToast('「' + name + '」を追加しました。「班と担当箇所」で班に入れてください。');
  }
  else if (a === 'item-meth'){
    const it = sheet().items.find(x => x.id === b.dataset.id); if (!it) return;
    it.methods = it.methods.includes(b.dataset.m) ? it.methods.filter(m => m !== b.dataset.m) : METHODS.filter(m => m === b.dataset.m || it.methods.includes(m));
    render(true);
  }
  else if (a === 'it-move'){ const s = sheet(); moveIn(s.items, s.items.findIndex(x => x.id === b.dataset.id), +b.dataset.d); render(true); }
  else if (a === 'it-del'){ if (!confirmTwice('item:' + b.dataset.id)) return; const s = sheet(); s.items = s.items.filter(x => x.id !== b.dataset.id); render(true); }
  else if (a === 'it-add'){
    const s = sheet(); const it = {id:uid('i'), text:'', methods:['目視'], group:s.items.length ? s.items[s.items.length - 1].group : '', months:null, since:todayISO()};
    s.items.push(it); render(true);
    const ta = document.querySelector(`textarea[data-id="${CSS.escape(it.id)}"]`); if (ta){ ta.scrollIntoView({block:'center'}); ta.focus(); }
  }
  else if (a === 'sh-copy'){
    const s = sheet(); const ns = clone(s); ns.id = uid('s'); ns.name = s.name + '（コピー）';
    ns.items.forEach(it => { it.id = uid('i'); });
    c.sheets.push(ns); S.editSheet = ns.id; render(true);
  }
  else if (a === 'sh-del'){ if (!confirmTwice('sheet:' + S.editSheet)) return; c.sheets = c.sheets.filter(x => x.id !== S.editSheet); S.editSheet = null; render(true); }
  else if (a === 'reset-settings'){ S.draftCfg = null; render(true); showToast('変更を取り消しました'); }
  else if (a === 'save-settings'){
    const cfg = clone(c);
    cfg.sheets.forEach(s => { s.items = s.items.filter(it => it.text.trim()); });
    const pr = findProblems(cfg);
    if (pr.msgs.length){ updateSaveBar(); showToast('保存できません。赤い欄を直してください。'); const f = document.querySelector('.input.dup'); if (f) f.focus(); return; }
    const valid = new Set(cfg.places.map(p => p.id));
    cfg.teams.forEach((t, i) => { if (!t.name) t.name = (i + 1) + '班'; t.places = t.places.filter(pid => valid.has(pid)); });
    b.disabled = true;
    store.saveConfig(cfg).then(() => { S.draftCfg = null; showToast('設定を保存しました'); render(true); },
      err => { b.disabled = false; showToast('保存できませんでした。通信状態を確認して、もう一度お試しください。'); });
  }
  else if (a === 'import-seed'){
    if (S.importing) return;
    S.importing = true; render(true);
    (async () => {
      try {
        const seed = await store.getSeed();
        if (!seed) throw new Error('初期データが見つかりません');
        const res = await store.importRecords(expandSeed(seed));
        S.draftCfg = null;
        showToast(`取り込みました（${res.added}件${res.skipped ? '、アプリで入力済みのため' + res.skipped + '件はそのまま' : ''}）`);
      } catch(err){ showToast('取り込めませんでした。通信状態を確認して、もう一度お試しください。'); }
      S.importing = false; render(true);
    })();
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.addto){
    if (!el.value) return;
    const t = S.draftCfg.teams.find(x => x.id === el.dataset.addto);
    if (t && !t.places.includes(el.value)) t.places.push(el.value);
    el.blur(); render(true); return;
  }
  if (el.dataset.e === 'editsheet'){ S.editSheet = el.value; S.confirm = null; el.blur(); render(true); return; }
  if (el.tagName === 'SELECT' && el.dataset.e){ draftInput(el); el.blur(); render(true); return; }
  if (el.dataset.field === 'team' && S.placeId){
    const t = teamById(el.value);
    patchRecord(S.placeId, S.period, {team:el.value, teamName:t ? t.name : ''});
    el.blur(); render(true);
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.e && el.tagName !== 'SELECT'){ draftInput(el); return; }
  const f = el.dataset.field;
  if (f === 'shoken'){ patchShoken(S.period, el.value); return; }
  if (f === 'cmt'){ patchCmt(el.dataset.place, el.dataset.period, el.dataset.item, {text: el.value}); return; }
  if (!f || !S.placeId) return;
  if (f === 'note') patchRecord(S.placeId, S.period, {notes:{[el.dataset.item]: el.value}});
  else if (f === 'memo') patchRecord(S.placeId, S.period, {memo:el.value});
  else if (f === 'date' && el.value) patchRecord(S.placeId, S.period, {date:el.value});
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input[data-field], input[data-e]')) e.target.blur();
});

/* ---- boot ---- */
const callbacks = {
  config(c){
    S.config = normConfig(c);
    if (S.config.year !== S.year){ S.year = S.config.year; S.server = {}; S.loaded = false; recompute(); store.resubscribe(); }
    S.places = buildPlaces(S.config);
    render();
  },
  records(m){ S.server = m; S.loaded = true; S.loadFailed = false; recompute(); if (!S.fromCache && (S.sync === 'loading' || S.sync === 'error')) setSync(pendingCount() ? 'saving' : 'saved'); render(); },
  one(k, r){ S.server[k] = r; recompute(); render(); },
  ok(){ if (S.sync === 'error' && !pendingCount()) setSync('saved'); },
  error(){ if (S.fromCache){ S.sync = 'error'; const el = $('#sync'); el.className = 'sync error'; el.querySelector('span').textContent = '前回の内容を表示中（通信できません）'; return; } setSync('error'); if (!S.loaded && !S.loadFailed){ S.loadFailed = true; render(); } }
};
function boot(){
  store = (hasGoogleRun() || /^https:/.test(API_URL)) ? makeGasStore() : makeLocalStore();
  S.mode = store.mode;
  store.start(callbacks);
}
/* 見出し部分の高さを測り、留めるボタン列の位置に使う */
(function(){
  const top = document.querySelector('.top');
  const set = () => document.documentElement.style.setProperty('--top-h', top.offsetHeight + 'px');
  set();
  if (window.ResizeObserver) new ResizeObserver(set).observe(top); else window.addEventListener('resize', set);
})();render(true);
boot();
})();
</script>
